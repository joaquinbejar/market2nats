[package]
name = "oracle"
version = "0.171.10"
edition.workspace = true
description = "Aggregated oracle price computation from multi-venue trade data"
license = "MIT"
repository = "https://github.com/joaquinbejar/market2nats"
# Not published: the `oracle` name on crates.io belongs to an unrelated crate
# (kubo/rust-oracle, an Oracle DB binding). This stays a workspace-internal
# crate, built and shipped as a Docker image like before.
publish = false

[features]
default = ["config"]
config = ["dep:toml"]

[[bin]]
name = "oracle"
path = "src/main.rs"
required-features = ["config"]

[dependencies]
market2nats-domain = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true, optional = true }
async-nats = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dashmap = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
portpicker = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
