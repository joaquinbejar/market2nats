[service]
name = "oracle"
log_level = "info"
log_format = "json"
http_port = 9091

[nats]
urls = ["${NATS_URL:-nats://localhost:4222}"]
# Private-CA broker: point tls_ca_file at the PEM bundle. It REPLACES the system
# root store, so include public roots in the bundle if this client also talks to
# a publicly-signed broker. tls_cert_file/tls_key_file enable mTLS and must be
# set together. All paths must be readable files at startup or the process
# aborts. Note these are flat keys here, unlike market2nats' [nats.tls] table.
# tls_required  = true
# tls_ca_file   = "/etc/oracle/tls/ca.pem"
# tls_cert_file = "/etc/oracle/tls/client.crt"
# tls_key_file  = "/etc/oracle/tls/client.key"

[[subscriptions]]
symbol = "BTC/USDT"
subjects = [
  "market.*.btc-usdt.trade",
  "market.*.btc-usd.trade",
]

[[subscriptions]]
symbol = "ETH/USDT"
subjects = [
  "market.*.eth-usdt.trade",
  "market.*.eth-usd.trade",
]

[pipeline]
strategy = "median_filtered"
staleness_max_ms = 10000
outlier_max_deviation_bps = 100
min_sources = 1
twap_window_ms = 30000

[publish]
subject_pattern = "oracle.<symbol_normalized>"
format = "json"
publish_interval_ms = 1000

# Optional WebSocket fan-out. Disabled by default to avoid opening a port
# unexpectedly. Flip `enabled` to true to expose the WS server on `port`.
[websocket]
enabled = false
port = 9092
path = "/"
# TLS support (wss://). When enabled, both files must be valid PEM.
# tls_enabled = true
# tls_cert_file = "/etc/oracle/tls/server.crt"
# tls_key_file  = "/etc/oracle/tls/server.key"
