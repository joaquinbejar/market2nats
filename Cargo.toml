[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# WebSocket
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
# TLS (rustls crypto provider + PEM loader for the oracle WebSocket server).
# rustls is reached through tokio-rustls' re-export so the process-level
# provider is always installed into the same rustls instance async-nats uses.
# default-features = false drops tokio-rustls' `aws-lc-rs` default, which is
# what enables rustls/aws-lc-rs and drags in the aws-lc-sys C/cmake build.
# `ring` is the provider installed at startup, so it is the one we want.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls-pemfile = "2"
# NATS
async-nats = "0.47"
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
prost = "0.14"
prost-build = "0.14"
bytes = "1"
# Decimal arithmetic
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
# Error handling
thiserror = "2"
# Logging & observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Metrics
metrics = "0.24"
# default-features = false drops the unused `http-listener` and `push-gateway`
# features. push-gateway pulls hyper-rustls/aws-lc-rs and with it the aws-lc-sys
# C/cmake build; neither binary uses either feature, both serve /metrics through
# axum and only call install_recorder() + PrometheusHandle::render().
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# Concurrent data structures
dashmap = "6"
# HTTP server (health + metrics)
axum = "0.8"
# Utilities
futures-util = "0.3"
url = "2"
# Internal crates
market2nats-domain = { path = "crates/market2nats-domain" }
# Dev/test
tokio-test = "0.4"
reqwest = { version = "0.13", features = ["json"] }
portpicker = "0.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
